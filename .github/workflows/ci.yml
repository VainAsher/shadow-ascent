name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SHADOWASCENT_CONTRACTS_VALIDATION_MODE: fail_fast

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run compile and diagnostics gates
        run: ./gradlew --no-daemon clean :core:compileJava :client:compileJava :server:compileJava runDataContractDiagnostics runWorldgenDiagnostics runRegressionTests
